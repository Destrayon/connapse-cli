name: CI

on:
  push:
    branches: [ main ]
  # Every pull request, whatever its base: a stacked PR targets the branch below it, not main, and
  # would otherwise go unchecked until that one merges.
  pull_request:
  # The nightly spec sync starts CI on its branch this way: its PR, opened with GITHUB_TOKEN, can't.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The checked-in client must be exactly what the pinned spec generates, so a hand edit or a stale
      # regeneration fails here instead of drifting from the server.
      - name: Generated client matches the pinned spec
        run: |
          scripts/generate-client.sh
          if [ -n "$(git status --porcelain -- src/Connapse.Client/Generated)" ]; then
            git status --short -- src/Connapse.Client/Generated
            echo "::error::src/Connapse.Client/Generated differs from what spec/openapi.json generates. Run scripts/generate-client.sh and commit the result."
            exit 1
          fi

      - name: Restore dependencies
        run: dotnet restore Connapse.Cli.slnx

      - name: Build
        run: dotnet build Connapse.Cli.slnx --no-restore --configuration Release

      # Every route in spec/openapi.json needs a CLI command or a listed reason (CC-13). Its own step, so
      # a nightly spec sync that brings a new route fails here by name.
      - name: Every API route has a CLI command or a listed reason
        run: dotnet test Connapse.Cli.slnx --no-build --configuration Release --filter "FullyQualifiedName~Connapse.Cli.Tests.ApiParity"

      - name: Run tests
        run: dotnet test Connapse.Cli.slnx --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=tests.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/*.trx'
          retention-days: 7
