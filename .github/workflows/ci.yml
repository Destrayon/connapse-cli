name: CI

on:
  push:
    branches: [ main ]
  # Every pull request, whatever its base: a stacked PR targets the branch below it, not main, and
  # would otherwise go unchecked until that one merges.
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Connapse.Cli.slnx

      - name: Build
        run: dotnet build Connapse.Cli.slnx --no-restore --configuration Release

      - name: Run tests
        run: dotnet test Connapse.Cli.slnx --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=tests.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/*.trx'
          retention-days: 7
