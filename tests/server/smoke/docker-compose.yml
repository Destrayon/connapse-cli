# A released Connapse server image (CON-129) with Postgres and MinIO, for the version smoke test.
# CONNAPSE_SMOKE_IMAGE names the image. Together the containers stay under 2 CPUs and 4 GB, so the
# test can run on a machine that is also in use.
name: connapse-smoke-test

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: connapse
      POSTGRES_USER: connapse
      POSTGRES_PASSWORD: smoke_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U connapse -d connapse"]
      interval: 5s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits: { memory: 512M, cpus: "0.5" }

  minio:
    image: cgr.dev/chainguard/minio
    user: "0"
    command: server /data
    environment:
      MINIO_ROOT_USER: smoke_test
      MINIO_ROOT_PASSWORD: smoke_test_secret
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits: { memory: 256M, cpus: "0.25" }

  web:
    image: ${CONNAPSE_SMOKE_IMAGE:?set CONNAPSE_SMOKE_IMAGE}
    ports:
      - "127.0.0.1:5112:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=connapse;Username=connapse;Password=smoke_test"
      Knowledge__Storage__MinIO__Endpoint: "minio:9000"
      Knowledge__Storage__MinIO__AccessKey: smoke_test
      Knowledge__Storage__MinIO__SecretKey: smoke_test_secret
      Knowledge__Storage__MinIO__UseSSL: "false"
      CONNAPSE_ADMIN_EMAIL: smoke-test@example.com
      CONNAPSE_ADMIN_PASSWORD: "Smoke-Test-Passw0rd!"
      Identity__Jwt__Secret: "smoke-test-jwt-secret-that-is-long-enough-0123456789"
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 2G, cpus: "1.25" }
