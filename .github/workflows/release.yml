name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.4.0)'
        required: true

permissions:
  contents: write   # needed to create GitHub Releases and upload assets

jobs:
  build-cli:
    name: Build CLI (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            ext: .exe
          - rid: linux-x64
            os: ubuntu-latest
            ext: ''
          - rid: osx-x64
            os: macos-latest
            ext: ''
          - rid: osx-arm64
            os: macos-latest
            ext: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish CLI (${{ matrix.rid }})
        shell: bash
        run: |
          dotnet publish src/Connapse.Cli/Connapse.Cli.csproj \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:PublishTrimmed=true \
            -p:EnableCompressionInSingleFile=true \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            --output publish/${{ matrix.rid }}

      - name: Rename binary
        shell: bash
        run: |
          src="publish/${{ matrix.rid }}/connapse${{ matrix.ext }}"
          dst="publish/${{ matrix.rid }}/connapse-cli-${{ matrix.rid }}${{ matrix.ext }}"
          mv "$src" "$dst"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: connapse-cli-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}/connapse-cli-${{ matrix.rid }}${{ matrix.ext }}
          retention-days: 1

  publish-nuget:
    name: Publish NuGet global tool
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Pack NuGet tool
        run: |
          dotnet pack src/Connapse.Cli/Connapse.Cli.csproj \
            --configuration Release \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            --output nupkgs

      - name: Upload nupkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: connapse-nupkg
          path: nupkgs/*.nupkg
          retention-days: 1

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "NUGET_API_KEY not set — skipping NuGet publish"
            exit 0
          fi
          dotnet nuget push nupkgs/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-cli, publish-nuget]

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: connapse-*
          merge-multiple: true
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Install

            ### NuGet global tool (requires .NET 10 SDK)
            ```bash
            dotnet tool install -g Connapse.CLI --version ${{ github.ref_name }}
            ```

            ### Self-contained binary (no .NET required)
            Download the binary for your platform below:
            - **Windows**: `connapse-cli-win-x64.exe`
            - **Linux**: `connapse-cli-linux-x64`
            - **macOS (Intel)**: `connapse-cli-osx-x64`
            - **macOS (Apple Silicon)**: `connapse-cli-osx-arm64`

            ```bash
            # Linux / macOS
            chmod +x connapse-cli-linux-x64
            sudo mv connapse-cli-linux-x64 /usr/local/bin/connapse
            ```

            ## Quick start
            ```bash
            connapse auth login --server https://www.connapse.com
            connapse org list
            connapse container list
            connapse search "query" --container my-container
            ```

            See [README](https://github.com/Destrayon/connapse-cli#readme) for the full command reference.
          files: release-assets/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
